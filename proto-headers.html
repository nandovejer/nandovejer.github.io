<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prototipos de cabecera</title>
<style>
  :root { color-scheme: light dark; --bg: #fbe6b4; --ink: #0d3249; --soft: #29557c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b2a3e; --ink: #fbe6b4; --soft: #93bcc0; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem clamp(1rem, 3vw, 3rem) 4rem; background: var(--bg); color: var(--ink); font: 15px/1.5 "Archivo", Arial, sans-serif; }
  h1 { font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 .25rem; }
  p { margin: 0 0 1.5rem; color: var(--soft); }
  .controls { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 2rem; }
  .controls button { font: 700 .75rem/1 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: .6rem .9rem; border: 1.5px solid var(--ink); background: none; color: var(--ink); border-radius: .35rem; cursor: pointer; }
  .controls button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  figure { margin: 0 0 2.5rem; }
  figcaption { display: flex; gap: 1rem; align-items: baseline; margin-bottom: .5rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .8rem; }
  figcaption span { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--soft); }
  figcaption a { margin-left: auto; color: var(--ink); }
  .frame { overflow: auto; border: 1.5px solid var(--ink); }
  iframe { display: block; border: 0; width: var(--w, 100%); height: 300px; margin-inline: auto; }
</style>
</head>
<body>
<h1>Prototipos de cabecera · Disquetes</h1>
<p>Cada marco es la página real con su variante (<code>?h=1…4</code>): se puede hacer scroll dentro, abrir el idioma y pulsar los enlaces.</p>
<div class="controls" role="group" aria-label="Ancho">
  <button type="button" data-w="100%" aria-pressed="true">Escritorio</button>
  <button type="button" data-w="820px" aria-pressed="false">Tablet 820</button>
  <button type="button" data-w="390px" aria-pressed="false">Móvil 390</button>
</div>
<figure><figcaption>0 · Actual <span>la de ahora, para comparar</span><a href="es/">abrir ↗</a></figcaption><div class="frame"><iframe src="es/" title="Cabecera actual"></iframe></div></figure>
<figure><figcaption>1 · Celdas <span>una fila de la cuadrícula partida en casillas, como la estantería</span><a href="es/?h=1">abrir ↗</a></figcaption><div class="frame"><iframe src="es/?h=1" title="Variante 1, Celdas"></iframe></div></figure>
<figure><figcaption>2 · Portada <span>cabecera de revista: la raya arriba, el nombre en la letra de los títulos</span><a href="es/?h=2">abrir ↗</a></figcaption><div class="frame"><iframe src="es/?h=2" title="Variante 2, Portada"></iframe></div></figure>
<figure><figcaption>3 · Disquetera <span>el frontal de la disquetera: plástico navy, LED y la tecla para el idioma</span><a href="es/?h=3">abrir ↗</a></figcaption><div class="frame"><iframe src="es/?h=3" title="Variante 3, Disquetera"></iframe></div></figure>
<figure><figcaption>4 · Botones <span>compacta y translúcida sobre la cuadrícula, con los botones de la web</span><a href="es/?h=4">abrir ↗</a></figcaption><div class="frame"><iframe src="es/?h=4" title="Variante 4, Botones"></iframe></div></figure>
<script>
  document.querySelectorAll('.controls button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.controls button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    document.documentElement.style.setProperty('--w', b.dataset.w);
  }));
</script>
</body>
</html>
